name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Forge app — lint, typecheck, test
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run ui:build
      - run: npx tsc --noEmit
      - run: npx eslint src test
      - run: npx vitest run
      - name: Validate manifest
        if: ${{ env.FORGE_EMAIL != '' && env.FORGE_API_TOKEN != '' }}
        run: |
          npm install -g @forge/cli@latest
          forge lint

  landing:
    name: Landing page — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build landing page
        working-directory: landing
        run: node build.mjs
      - name: Verify built pages
        working-directory: landing
        run: |
          test -f dist/index.html
          test -f dist/setup/index.html
          test -f dist/privacy/index.html
          test -f dist/support/index.html
